# Konfiguration für geowarden. Wird vom Menü-Tool "geowarden" bearbeitet.
# Nach Änderungen von Hand: systemctl start geowarden.service

# Sperre an (yes) oder aus (no). Nach der Installation aus, damit du dich
# nicht versehentlich aussperrst - einschalten mit "geowarden".
ENABLED="no"

# Erlaubte Länder (ISO-3166 Alpha-2, klein geschrieben), getrennt durch Leerzeichen.
# Vorgabe: Europa ohne RU und BY, plus USA. Länderzuordnung per Geolokation (DB-IP Lite).
COUNTRIES="ad al at ax ba be bg ch cy cz de dk ee es fi fo fr gb gg gi gr hr hu ie im is it je li lt lu lv mc md me mk mt nl no pl pt ro rs se si sk sm ua us va"

# Öffentliche(s) Interface(s), getrennt durch Leerzeichen. Leer = automatisch die
# Interfaces der Default-Routen. Alle anderen (VPN, Docker-Bridges, lo) bleiben ungefiltert.
WAN_IF=""

# Ports, die weltweit offen bleiben (getrennt durch Leerzeichen, leer = keine).
# tcp/80 für die Let's-Encrypt-HTTP-01-Prüfung (Prüfung kommt von Servern weltweit),
# udp/41641 für direkte Tailscale-Verbindungen.
OPEN_TCP="80"
OPEN_UDP="41641"
