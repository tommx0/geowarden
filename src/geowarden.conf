# Configuration for geowarden. Edited by the menu tool "geowarden".
# After editing by hand: systemctl start geowarden.service

# Blocking on (yes) or off (no). Off after installation so you don't lock
# yourself out by accident - turn it on with "geowarden".
ENABLED="no"

# Allowed countries (ISO 3166 alpha-2, lower case), separated by spaces.
# Default: Europe without RU and BY, plus the USA. Country lookup via geolocation (DB-IP Lite).
COUNTRIES="ad al at ax ba be bg ch cy cz de dk ee es fi fo fr gb gg gi gr hr hu ie im is it je li lt lu lv mc md me mk mt nl no pl pt ro rs se si sk sm ua us va"

# Public interface(s), separated by spaces. Empty = automatically the interfaces
# of the default routes. All others (VPN, Docker bridges, lo) stay unfiltered.
WAN_IF=""

# Ports that stay open worldwide (separated by spaces, empty = none).
# tcp/80 for the Let's Encrypt HTTP-01 challenge (validation comes from servers worldwide),
# udp/41641 for direct Tailscale connections.
OPEN_TCP="80"
OPEN_UDP="41641"

# Statistics: the most source addresses each of the four lists (IPv4/IPv6, allowed/blocked)
# keeps. One address needs about 160-280 bytes of kernel memory, so 10000 means at most
# 40000 addresses and about 6-11 MB. 0 turns the statistics off. A change starts them over.
STATS_MAX="10000"
